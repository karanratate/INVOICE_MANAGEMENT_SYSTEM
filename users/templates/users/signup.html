{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Premium Invoice System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #1e293b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            padding: 20px;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
        }
        .orb-1 { width: 300px; height: 300px; background: #3b82f6; top: -50px; left: -50px; opacity: 0.5; }
        .orb-2 { width: 400px; height: 400px; background: #8b5cf6; bottom: -100px; right: -100px; opacity: 0.5; }

        /* Glass Card */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 550px;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            color: white;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            font-size: 40px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .glass-card h2 {
            font-weight: 700;
            font-size: 2rem;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .glass-card p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 35px;
        }

        /* Floating Label Inputs */
        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group-custom input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group-custom input:focus {
            border-color: #8b5cf6;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
        }

        .input-group-custom label {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            pointer-events: none;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .input-group-custom input:focus ~ label,
        .input-group-custom input:not(:placeholder-shown) ~ label {
            top: -10px;
            left: 15px;
            font-size: 0.8rem;
            color: #a78bfa;
            background: #1e1b4b;
            padding: 0 5px;
            border-radius: 4px;
        }

        /* Gradient Button */
        .btn-glow {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
            margin-top: 10px;
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
        }

        .btn-glow:active {
            transform: translateY(0);
        }

        /* Links & Alerts */
        .auth-link {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .auth-link:hover {
            color: #c4b5fd;
        }

        .alert-custom {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            border-radius: 12px;
            font-size: 0.9rem;
            padding: 12px 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Background Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Signup Card -->
    <div class="glass-card">
        <div class="text-center">
            <i class="fas fa-file-invoice-dollar logo-icon"></i>
            <h2>Create Account</h2>
            <p class="subtitle"></p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert-custom text-center mb-3">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'users:signup' %}">
            {% csrf_token %}
            
            <div class="row">
                <div class="col-md-6">
                    <div class="input-group-custom">
                        <input type="text" name="first_name" id="fname" placeholder=" " required>
                        <label for="fname">First Name</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="input-group-custom">
                        <input type="text" name="last_name" id="lname" placeholder=" " required>
                        <label for="lname">Last Name</label>
                    </div>
                </div>
            </div>

            <div class="input-group-custom">
                <input type="email" name="email" id="email" placeholder=" " required>
                <label for="email">Email Address</label>
            </div>
            
            <div class="input-group-custom">
                <input type="text" name="phone" id="phone" placeholder=" " required>
                <label for="phone">Phone Number</label>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="input-group-custom">
                        <input type="password" name="password" id="pass1" placeholder=" " required>
                        <label for="pass1">Password</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="input-group-custom">
                        <input type="password" name="confirm_password" id="pass2" placeholder=" " required>
                        <label for="pass2">Confirm Password</label>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="btn-glow">
                Register <i class="fas fa-user-plus ms-2"></i>
            </button>
        </form>
        
        <div class="text-center mt-4" style="color: #94a3b8; font-size: 0.95rem;">
            Already have an account? <a href="{% url 'login' %}" class="auth-link">Sign In</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
