{% extends 'core/base.html' %}
{% load static %}

{% block title %}Edit Customer - Invoice Management System{% endblock %}
{% block page_title %}Edit Customer{% endblock %}

{% block content %}

<form method="POST" action="{% url 'customers:customer_edit' customer.id %}" id="customerForm">
    {% csrf_token %}

    <div class="row">
        <!-- Billing Information -->
        <div class="col-lg-6 mb-3">
            <div class="card h-100">
                <div class="card-header bg-white">
                    <h6 class="mb-0">
                        <i class="fas fa-home me-2 text-primary"></i>
                        Billing Information
                    </h6>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label">
                                Full Name <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   value="{{ customer.name }}"
                                   required
                                   autofocus>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">
                                Email <span class="text-danger">*</span>
                            </label>
                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   value="{{ customer.email }}"
                                   required>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Phone</label>
                            <input type="text"
                                   name="phone"
                                   class="form-control"
                                   value="{{ customer.phone|default:'' }}">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Address Line 1</label>
                            <input type="text"
                                   name="address_line1"
                                   class="form-control"
                                   value="{{ customer.address_line1|default:'' }}">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Address Line 2</label>
                            <input type="text"
                                   name="address_line2"
                                   class="form-control"
                                   value="{{ customer.address_line2|default:'' }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">City</label>
                            <input type="text"
                                   name="city"
                                   class="form-control"
                                   value="{{ customer.city|default:'' }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">State</label>
                            <input type="text"
                                   name="state"
                                   class="form-control"
                                   value="{{ customer.state|default:'' }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Postal Code</label>
                            <input type="text"
                                   name="postal_code"
                                   class="form-control"
                                   value="{{ customer.postal_code|default:'' }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Country</label>
                            <input type="text"
                                   name="country"
                                   class="form-control"
                                   value="{{ customer.country|default:'' }}">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Shipping Information -->
        <div class="col-lg-6 mb-3">
            <div class="card h-100">
                <div class="card-header bg-white">
                    <h6 class="mb-0">
                        <i class="fas fa-truck me-2 text-success"></i>
                        Shipping Information
                    </h6>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label">Full Name</label>
                            <input type="text"
                                   name="shipping_name"
                                   class="form-control"
                                   value="{{ customer.shipping_name|default:'' }}">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Address Line 1</label>
                            <input type="text"
                                   name="shipping_address_line1"
                                   class="form-control"
                                   value="{{ customer.shipping_address_line1|default:'' }}">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Address Line 2</label>
                            <input type="text"
                                   name="shipping_address_line2"
                                   class="form-control"
                                   value="{{ customer.shipping_address_line2|default:'' }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">City</label>
                            <input type="text"
                                   name="shipping_city"
                                   class="form-control"
                                   value="{{ customer.shipping_city|default:'' }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">State</label>
                            <input type="text"
                                   name="shipping_state"
                                   class="form-control"
                                   value="{{ customer.shipping_state|default:'' }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Postal Code</label>
                            <input type="text"
                                   name="shipping_postal_code"
                                   class="form-control"
                                   value="{{ customer.shipping_postal_code|default:'' }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Country</label>
                            <input type="text"
                                   name="shipping_country"
                                   class="form-control"
                                   value="{{ customer.shipping_country|default:'' }}">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body d-flex gap-2">
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save me-2"></i> Update Customer
            </button>
            <a href="{% url 'customers:customer_list' %}" class="btn btn-secondary">
                <i class="fas fa-times me-2"></i> Cancel
            </a>
        </div>
    </div>
</form>

{% endblock %}
